services:
  db:
    image: postgres:16
    container_name: feedback_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: feedback_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: feedback_redis_broker
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
